apis:
- aid: revel:webhooks
  name: Revel Webhooks
  description: >-
    Event-driven webhook channel that delivers POS events (order finalized, customer created/updated,
    stock changes, menu updates, timesheet changes, integration changes, reward cards, and ping) to partner
    HTTPS endpoints via POST. Payloads are signed with an HMAC-SHA1 X-Revel-Signature header.
  humanURL: https://developer.revelsystems.com/revelsystems/docs/webhooks
  tags:
  - Webhooks
  - Events
  - POS
