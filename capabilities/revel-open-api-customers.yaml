naftiko: 1.0.0-alpha2
info:
  label: Revel Open API — Customers
  description: 'Customers surface of the Revel Open API. 3 operations. Lead operation: Get Customers. Self-contained Naftiko capability covering one Revel Systems business surface.'
  tags:
  - Revel Systems
  - POS
  - Customers
  created: '2026-06-03'
  modified: '2026-06-03'
binds:
- namespace: env
  keys:
    REVEL_API_KEY: REVEL_API_KEY
capability:
  consumes:
  - type: http
    namespace: revel-open-api-customers
    baseUri: https://yoursubdomain.revelup.com/resources
    description: Revel Open API — Customers business capability. Self-contained, no shared references.
    authentication:
      type: apikey
      key: API-AUTHENTICATION
      value: '{{env.REVEL_API_KEY}}'
      placement: header
    resources:
    - name: customer
      path: /Customer/
      operations:
      - name: getCustomers
        method: GET
        description: Get Customers
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum number of objects to return per page. Use `0` to disable pagination.
        - name: offset
          in: query
          type: integer
          required: false
          description: Zero-based offset of the first object to return.
        - name: fields
          in: query
          type: array
          required: false
          description: Comma-separated list of direct resource attributes to return (e.g. `id,name,price`).
        - name: order_by
          in: query
          type: string
          required: false
          description: ''
        - name: first_name
          in: query
          type: string
          required: false
          description: ''
        - name: last_name
          in: query
          type: string
          required: false
          description: ''
        - name: email
          in: query
          type: string
          required: false
          description: ''
        - name: phone_number
          in: query
          type: string
          required: false
          description: ''
        - name: active
          in: query
          type: boolean
          required: false
          description: ''
        - name: ref_number
          in: query
          type: string
          required: false
          description: ''
        - name: created_date
          in: query
          type: string
          required: false
          description: ''
        - name: updated_date
          in: query
          type: string
          required: false
          description: ''
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: customer
      path: /Customer/
      operations:
      - name: createCustomer
        method: POST
        description: Create Customer
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
          description: Request body.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: customer-id
      path: /Customer/{id}/
      operations:
      - name: getCustomer
        method: GET
        description: Get Customer
        inputParameters:
        - name: id
          in: path
          type: integer
          required: true
          description: Numeric resource identifier.
        - name: fields
          in: query
          type: array
          required: false
          description: Comma-separated list of direct resource attributes to return (e.g. `id,name,price`).
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: revel-open-api-customers-rest
    port: 8080
    description: REST adapter for Revel Open API — Customers. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/customer
      name: customer
      description: REST surface for Get Customers.
      operations:
      - method: GET
        name: getCustomers
        description: Get Customers
        call: revel-open-api-customers.getCustomers
        with:
          limit: rest.limit
          offset: rest.offset
          fields: rest.fields
          order_by: rest.order_by
          first_name: rest.first_name
          last_name: rest.last_name
          email: rest.email
          phone_number: rest.phone_number
          active: rest.active
          ref_number: rest.ref_number
          created_date: rest.created_date
          updated_date: rest.updated_date
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/customer
      name: customer
      description: REST surface for Create Customer.
      operations:
      - method: POST
        name: createCustomer
        description: Create Customer
        call: revel-open-api-customers.createCustomer
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/customer/{id}
      name: customer-id
      description: REST surface for Get Customer.
      operations:
      - method: GET
        name: getCustomer
        description: Get Customer
        call: revel-open-api-customers.getCustomer
        with:
          id: rest.id
          fields: rest.fields
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: revel-open-api-customers-mcp
    port: 9090
    transport: http
    description: MCP adapter for Revel Open API — Customers. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: get-customers
      description: Get Customers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: revel-open-api-customers.getCustomers
      with:
        limit: tools.limit
        offset: tools.offset
        fields: tools.fields
        order_by: tools.order_by
        first_name: tools.first_name
        last_name: tools.last_name
        email: tools.email
        phone_number: tools.phone_number
        active: tools.active
        ref_number: tools.ref_number
        created_date: tools.created_date
        updated_date: tools.updated_date
      outputParameters:
      - type: object
        mapping: $.
    - name: create-customer
      description: Create Customer
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: revel-open-api-customers.createCustomer
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-customer
      description: Get Customer
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: revel-open-api-customers.getCustomer
      with:
        id: tools.id
        fields: tools.fields
      outputParameters:
      - type: object
        mapping: $.
