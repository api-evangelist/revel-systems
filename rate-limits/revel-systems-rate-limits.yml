description: Revel Open API rate limits are not openly published. Honor 429 responses.
notes: Contact Revel partner support for high-volume integration limits.
sources:
- https://developer.revelsystems.com/
- https://developer.revelsystems.com/revelsystems/docs/webhooks
responseCodes:
  throttled: 429
limits:
- name: Default Open API
  scope: establishment
  metric: requests
  limit: not publicly documented
  notes: Honor 429.
- name: Webhook Delivery Window
  scope: endpoint
  metric: response-time
  limit: 10 seconds
  notes: Partner webhook endpoints must return a 2XX response within 10 seconds or delivery is treated as failed.
policies:
- name: Backoff Strategy
  description: Clients should implement exponential backoff with jitter and honor any Retry-After header.
- name: Webhook Retry Policy
  description: >-
    Failed webhook deliveries are retried with exponential backoff over roughly 36 minutes:
    retry 1 after 60s, retry 2 after 300s, retries 3 and 4 after 900s each.
