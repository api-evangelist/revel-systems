naftiko: 1.0.0-alpha2
info:
  label: Revel Open API — Products
  description: 'Products surface of the Revel Open API. 3 operations. Lead operation: Get Products. Self-contained Naftiko capability covering one Revel Systems business surface.'
  tags:
  - Revel Systems
  - POS
  - Products
  created: '2026-06-03'
  modified: '2026-06-03'
binds:
- namespace: env
  keys:
    REVEL_API_KEY: REVEL_API_KEY
capability:
  consumes:
  - type: http
    namespace: revel-open-api-products
    baseUri: https://yoursubdomain.revelup.com/resources
    description: Revel Open API — Products business capability. Self-contained, no shared references.
    authentication:
      type: apikey
      key: API-AUTHENTICATION
      value: '{{env.REVEL_API_KEY}}'
      placement: header
    resources:
    - name: product
      path: /Product/
      operations:
      - name: getProducts
        method: GET
        description: Get Products
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum number of objects to return per page. Use `0` to disable pagination.
        - name: offset
          in: query
          type: integer
          required: false
          description: Zero-based offset of the first object to return.
        - name: fields
          in: query
          type: array
          required: false
          description: Comma-separated list of direct resource attributes to return (e.g. `id,name,price`).
        - name: order_by
          in: query
          type: string
          required: false
          description: ''
        - name: name
          in: query
          type: string
          required: false
          description: ''
        - name: barcode
          in: query
          type: string
          required: false
          description: ''
        - name: sku
          in: query
          type: string
          required: false
          description: ''
        - name: category
          in: query
          type: integer
          required: false
          description: ''
        - name: active
          in: query
          type: boolean
          required: false
          description: ''
        - name: establishment
          in: query
          type: integer
          required: false
          description: ''
        - name: display_online
          in: query
          type: boolean
          required: false
          description: ''
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: product
      path: /Product/
      operations:
      - name: createProduct
        method: POST
        description: Create Product
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
          description: Request body.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: product-id
      path: /Product/{id}/
      operations:
      - name: getProduct
        method: GET
        description: Get Product
        inputParameters:
        - name: id
          in: path
          type: integer
          required: true
          description: Numeric resource identifier.
        - name: fields
          in: query
          type: array
          required: false
          description: Comma-separated list of direct resource attributes to return (e.g. `id,name,price`).
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: revel-open-api-products-rest
    port: 8080
    description: REST adapter for Revel Open API — Products. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/product
      name: product
      description: REST surface for Get Products.
      operations:
      - method: GET
        name: getProducts
        description: Get Products
        call: revel-open-api-products.getProducts
        with:
          limit: rest.limit
          offset: rest.offset
          fields: rest.fields
          order_by: rest.order_by
          name: rest.name
          barcode: rest.barcode
          sku: rest.sku
          category: rest.category
          active: rest.active
          establishment: rest.establishment
          display_online: rest.display_online
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/product
      name: product
      description: REST surface for Create Product.
      operations:
      - method: POST
        name: createProduct
        description: Create Product
        call: revel-open-api-products.createProduct
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/product/{id}
      name: product-id
      description: REST surface for Get Product.
      operations:
      - method: GET
        name: getProduct
        description: Get Product
        call: revel-open-api-products.getProduct
        with:
          id: rest.id
          fields: rest.fields
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: revel-open-api-products-mcp
    port: 9090
    transport: http
    description: MCP adapter for Revel Open API — Products. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: get-products
      description: Get Products
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: revel-open-api-products.getProducts
      with:
        limit: tools.limit
        offset: tools.offset
        fields: tools.fields
        order_by: tools.order_by
        name: tools.name
        barcode: tools.barcode
        sku: tools.sku
        category: tools.category
        active: tools.active
        establishment: tools.establishment
        display_online: tools.display_online
      outputParameters:
      - type: object
        mapping: $.
    - name: create-product
      description: Create Product
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: revel-open-api-products.createProduct
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-product
      description: Get Product
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: revel-open-api-products.getProduct
      with:
        id: tools.id
        fields: tools.fields
      outputParameters:
      - type: object
        mapping: $.
