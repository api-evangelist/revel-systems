naftiko: 1.0.0-alpha2
info:
  label: Revel Open API — Scheduling
  description: 'Scheduling surface of the Revel Open API. 2 operations. Lead operation: Get Time Schedules. Self-contained Naftiko capability covering one Revel Systems business surface.'
  tags:
  - Revel Systems
  - POS
  - Scheduling
  created: '2026-06-03'
  modified: '2026-06-03'
binds:
- namespace: env
  keys:
    REVEL_API_KEY: REVEL_API_KEY
capability:
  consumes:
  - type: http
    namespace: revel-open-api-scheduling
    baseUri: https://yoursubdomain.revelup.com/resources
    description: Revel Open API — Scheduling business capability. Self-contained, no shared references.
    authentication:
      type: apikey
      key: API-AUTHENTICATION
      value: '{{env.REVEL_API_KEY}}'
      placement: header
    resources:
    - name: timeschedule
      path: /TimeSchedule/
      operations:
      - name: getTimeSchedules
        method: GET
        description: Get Time Schedules
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum number of objects to return per page. Use `0` to disable pagination.
        - name: offset
          in: query
          type: integer
          required: false
          description: Zero-based offset of the first object to return.
        - name: fields
          in: query
          type: array
          required: false
          description: Comma-separated list of direct resource attributes to return (e.g. `id,name,price`).
        - name: establishment
          in: query
          type: integer
          required: false
          description: ''
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: timeschedule
      path: /TimeSchedule/
      operations:
      - name: createTimeSchedule
        method: POST
        description: Create Time Schedule
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
          description: Request body.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: revel-open-api-scheduling-rest
    port: 8080
    description: REST adapter for Revel Open API — Scheduling. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/timeschedule
      name: timeschedule
      description: REST surface for Get Time Schedules.
      operations:
      - method: GET
        name: getTimeSchedules
        description: Get Time Schedules
        call: revel-open-api-scheduling.getTimeSchedules
        with:
          limit: rest.limit
          offset: rest.offset
          fields: rest.fields
          establishment: rest.establishment
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/timeschedule
      name: timeschedule
      description: REST surface for Create Time Schedule.
      operations:
      - method: POST
        name: createTimeSchedule
        description: Create Time Schedule
        call: revel-open-api-scheduling.createTimeSchedule
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: revel-open-api-scheduling-mcp
    port: 9090
    transport: http
    description: MCP adapter for Revel Open API — Scheduling. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: get-time-schedules
      description: Get Time Schedules
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: revel-open-api-scheduling.getTimeSchedules
      with:
        limit: tools.limit
        offset: tools.offset
        fields: tools.fields
        establishment: tools.establishment
      outputParameters:
      - type: object
        mapping: $.
    - name: create-time-schedule
      description: Create Time Schedule
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: revel-open-api-scheduling.createTimeSchedule
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
