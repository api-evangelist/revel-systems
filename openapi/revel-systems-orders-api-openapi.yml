components:
  schemas:
    OrderList:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        objects:
          type: array
          items:
            $ref: '#/components/schemas/Order'
    Order:
      type: object
      x-schema-source: documentation
      x-source-url: https://developer.revelsystems.com/revelsystems/reference/getorders
      properties:
        id:
          type: integer
          example: 1
        uuid:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
        establishment:
          type: integer
          description: Foreign key to Establishment.
          example: 1
        customer:
          type:
          - integer
          - 'null'
          description: Foreign key to Customer.
          example: 1
        created_by:
          type: integer
          description: Employee who created the order.
          example: 1
        call_number:
          type:
          - integer
          - 'null'
          example: 42
        call_name:
          type:
          - string
          - 'null'
          example: Window
        running_tax_number:
          type:
          - integer
          - 'null'
          example: 42
        web_order:
          type: boolean
          example: true
        is_invoice:
          type: boolean
          example: true
        closed:
          type: boolean
          example: true
        printed:
          type: boolean
          example: true
        has_items:
          type: boolean
          example: true
        has_history:
          type: boolean
          example: true
        dining_option:
          type:
          - integer
          - 'null'
          example: 42
        delivery_employee:
          type:
          - integer
          - 'null'
          example: 42
        device_id:
          type:
          - integer
          - 'null'
          example: 1
        local_id:
          type:
          - string
          - 'null'
          example: LOC-1
        pickup_time:
          type:
          - string
          - 'null'
          format: date-time
          example: '2026-06-01T12:00:00Z'
        created_date:
          type: string
          format: date-time
          example: '2026-06-01T12:00:00Z'
        updated_date:
          type: string
          format: date-time
          example: '2026-06-01T12:00:00Z'
        resource_uri:
          type: string
          example: /resources/Resource/1/
    Meta:
      type: object
      description: Tastypie pagination envelope.
      properties:
        total_count:
          type: integer
          example: 142
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
        next:
          type:
          - string
          - 'null'
          example: /resources/Order/?limit=20&offset=20
        previous:
          type:
          - string
          - 'null'
          example: null
  parameters:
    idPath:
      name: id
      in: path
      required: true
      description: Numeric resource identifier.
      schema:
        type: integer
    offset:
      name: offset
      in: query
      description: Zero-based offset of the first object to return.
      schema:
        type: integer
        default: 0
    fields:
      name: fields
      in: query
      description: Comma-separated list of direct resource attributes to return (e.g. `id,name,price`).
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false
    limit:
      name: limit
      in: query
      description: Maximum number of objects to return per page. Use `0` to disable pagination.
      schema:
        type: integer
        default: 20
  responses:
    RateLimited:
      description: Too many requests. Honor the Retry-After header and back off.
    NotFound:
      description: The requested resource was not found.
    Unauthorized:
      description: Authentication failed or was not provided.
  securitySchemes:
    apiAuthentication:
      type: apiKey
      in: header
      name: API-AUTHENTICATION
      description: 'API key and secret joined by a colon, e.g. `API-AUTHENTICATION: key:secret`. The key and secret may alternatively be passed as `api_key` and `api_secret` query parameters.'
