naftiko: 1.0.0-alpha2
info:
  label: Revel Open API — Establishments
  description: 'Establishments surface of the Revel Open API. 1 operations. Lead operation: Get Establishments. Self-contained Naftiko capability covering one Revel Systems business surface.'
  tags:
  - Revel Systems
  - POS
  - Establishments
  created: '2026-06-03'
  modified: '2026-06-03'
binds:
- namespace: env
  keys:
    REVEL_API_KEY: REVEL_API_KEY
capability:
  consumes:
  - type: http
    namespace: revel-open-api-establishments
    baseUri: https://yoursubdomain.revelup.com/resources
    description: Revel Open API — Establishments business capability. Self-contained, no shared references.
    authentication:
      type: apikey
      key: API-AUTHENTICATION
      value: '{{env.REVEL_API_KEY}}'
      placement: header
    resources:
    - name: establishment
      path: /Establishment/
      operations:
      - name: getEstablishments
        method: GET
        description: Get Establishments
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum number of objects to return per page. Use `0` to disable pagination.
        - name: offset
          in: query
          type: integer
          required: false
          description: Zero-based offset of the first object to return.
        - name: fields
          in: query
          type: array
          required: false
          description: Comma-separated list of direct resource attributes to return (e.g. `id,name,price`).
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: revel-open-api-establishments-rest
    port: 8080
    description: REST adapter for Revel Open API — Establishments. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/establishment
      name: establishment
      description: REST surface for Get Establishments.
      operations:
      - method: GET
        name: getEstablishments
        description: Get Establishments
        call: revel-open-api-establishments.getEstablishments
        with:
          limit: rest.limit
          offset: rest.offset
          fields: rest.fields
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: revel-open-api-establishments-mcp
    port: 9090
    transport: http
    description: MCP adapter for Revel Open API — Establishments. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: get-establishments
      description: Get Establishments
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: revel-open-api-establishments.getEstablishments
      with:
        limit: tools.limit
        offset: tools.offset
        fields: tools.fields
      outputParameters:
      - type: object
        mapping: $.
